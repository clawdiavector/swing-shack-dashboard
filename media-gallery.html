<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swing Shack Media Library</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 { color: #e94560; margin-bottom: 20px; }
        
        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .cat-btn {
            padding: 8px 16px;
            background: #16213e;
            border: 1px solid #0f3460;
            border-radius: 20px;
            color: #eee;
            cursor: pointer;
        }
        .cat-btn.active { background: #e94560; border-color: #e94560; }
        
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .item {
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }
        .item .name {
            padding: 10px;
            font-size: 0.75em;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .item .cat-tag {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #e94560;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7em;
        }
        
        .upload-zone {
            border: 2px dashed #0f3460;
            padding: 40px;
            text-align: center;
            margin-bottom: 20px;
            border-radius: 10px;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #16213e;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <h1>📸 Swing Shack Media Library</h1>
    
    <div class="upload-zone">
        Drop new photos here to add to inbound folder
    </div>
    
    <div class="stats" id="stats">
        Loading...
    </div>
    
    <div class="categories">
        <button class="cat-btn active" data-cat="all">All</button>
        <button class="cat-btn" data-cat="inbound">Inbound</button>
        <button class="cat-btn" data-cat="facility">Facility</button>
        <button class="cat-btn" data-cat="trackman">TrackMan</button>
        <button class="cat-btn" data-cat="clubs">Clubs</button>
        <button class="cat-btn" data-cat="customers">Customers</button>
        <button class="cat-btn" data-cat="golf">Golf</button>
        <button class="cat-btn" data-cat="logo">Logo</button>
    </div>
    
    <div class="gallery" id="gallery"></div>

        function renderGallery(filter = 'all') {
            const gallery = document.getElementById('gallery');
            const filtered = filter === 'all' ? files : files.filter(f => f.includes(filter));
            
            gallery.innerHTML = filtered.map(f => `
                <div class="item">
                    <img src="${basePath}/${f}" alt="${f}">
                    <div class="name">${f.substring(0, 20)}...</div>
                </div>
            `).join('');
        }
        
        // Count files by category (simplified)
        document.getElementById('stats').innerHTML = `
            <div><strong>${files.length}</strong> total photos</div>
        `;
        
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderGallery(btn.dataset.cat);
            });
        });
        
        renderGallery();
    </script>
</body>
</html>
