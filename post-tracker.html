<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swing Shack - Post Tracker</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
        }
        h1 { color: #e94560; margin-bottom: 20px; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat h2 { font-size: 2em; color: #e94560; }
        .stat p { color: #888; font-size: 0.9em; }
        
        .posts {
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .post {
            padding: 20px;
            border-bottom: 1px solid #0f3460;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .post:last-child { border-bottom: none; }
        
        .post-info h3 { color: #fff; margin-bottom: 5px; }
        .post-info p { color: #888; font-size: 0.9em; }
        
        .metrics {
            display: flex;
            gap: 15px;
        }
        .metric {
            text-align: center;
        }
        .metric span { display: block; font-size: 1.2em; color: #e94560; }
        .metric label { font-size: 0.75em; color: #666; }
        
        .add-form {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .add-form h3 { margin-bottom: 15px; }
        .add-form input, .add-form select {
            padding: 10px;
            margin: 5px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #0f3460;
            color: #fff;
        }
        .add-form button {
            padding: 10px 20px;
            background: #e94560;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>📊 Post Performance Tracker</h1>
    
    <div class="stats">
        <div class="stat">
            <h2 id="total-posts">0</h2>
            <p>Total Posts</p>
        </div>
        <div class="stat">
            <h2 id="total-likes">0</h2>
            <p>Total Likes</p>
        </div>
        <div class="stat">
            <h2 id="total-clicks">0</h2>
            <p>Total Clicks</p>
        </div>
        <div class="stat">
            <h2 id="total-bookings">0</h2>
            <p>Bookings</p>
        </div>
    </div>
    
    <div class="posts" id="posts-list">
        <p style="padding:20px;color:#666">No posts tracked yet</p>
    </div>
    
    <script>
        async function loadTracking() {
            try {
                const response = await fetch('data/post-tracking.json');
                const data = await response.json();
                render(data);
            } catch (e) {
                console.log('No tracking data yet');
            }
        }
        
        function render(data) {
            const posts = data.posts || [];
            
            // Stats
            document.getElementById('total-posts').textContent = posts.length;
            document.getElementById('total-likes').textContent = posts.reduce((s, p) => s + (p.metrics?.likes || 0), 0);
            document.getElementById('total-clicks').textContent = posts.reduce((s, p) => s + (p.metrics?.clicks || 0), 0);
            document.getElementById('total-bookings').textContent = posts.reduce((s, p) => s + (p.metrics?.bookings || 0), 0);
            
            // Posts list
            const list = document.getElementById('posts-list');
            if (posts.length === 0) {
                list.innerHTML = '<p style="padding:20px;color:#666">No posts tracked yet</p>';
                return;
            }
            
            list.innerHTML = posts.map(p => `
                <div class="post">
                    <div class="post-info">
                        <h3>${p.service}</h3>
                        <p>"${p.hook}"</p>
                        <p style="font-size:0.8em;color:#666">${new Date(p.postedAt).toLocaleDateString()}</p>
                    </div>
                    <div class="metrics">
                        <div class="metric"><span>${p.metrics?.likes || 0}</span><label>Likes</label></div>
                        <div class="metric"><span>${p.metrics?.clicks || 0}</span><label>Clicks</label></div>
                        <div class="metric"><span>${p.metrics?.bookings || 0}</span><label>Bookings</label></div>
                    </div>
                </div>
            `).join('');
        }
        
        loadTracking();
        setInterval(loadTracking, 10000);
    </script>
</body>
</html>
