[pytest]
# Repo-root anchor so `pytest` and `cd campaign-os && pytest tests/` agree.
testpaths = campaign-os/tests tests scripts/tests
# scripts/ is on path so scripts/tests can import validate_railway_deploy_wiring
# without editing that file's broken SCRIPTS = HERE.parent / "scripts" (scoped
# path forbids scripts/tests edits in this job; pythonpath is the unblock).
pythonpath = scripts
    campaign-os
norecursedirs = legacy .git node_modules .venv venv media assets
addopts = --strict-markers --ignore-glob=**/walk_*.py
markers =
    cos_anon: test expects an unauthenticated client
