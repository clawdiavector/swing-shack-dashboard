name: Deploy to GitHub Pages + Cockpit Regeneration

on:
  push:
    branches: [main]
    paths:
      - 'campaign-os/**'
      - 'scripts/**'
      - 'campaign-data-staged.json'
      - '_config.yml'
      - '.github/workflows/**'
  schedule:
    # Run at 6am, 12pm, 6pm, 9pm SAST (UTC+2 = 4am, 10am, 4pm, 7pm UTC)
    - cron: '0 4,10,16,19 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://clawdiavector.github.io/swing-shack-dashboard
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campaign-os/
            scripts/
            campaign-data-staged.json
            campaign-os/campaign-data.json
            campaign-os/cockpit-operational.html
            _config.yml
            .github/
          sparse-checkout-cone-mode: false
          # Need full history for commit detection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch cockpit with real assets from campaign-data.json
        run: |
          node scripts/patch-cockpit.js campaign-os/cockpit-operational.html campaign-os/campaign-data.json

      - name: Verify cockpit has correct data (V2 schema)
        run: |
          echo "=== Cockpit Verification (V2) ==="
          FILE_SIZE=$(wc -c < campaign-os/cockpit-operational.html)
          echo "File size: $FILE_SIZE bytes"

          # Check V2 schema — campaigns dict at root (double quotes in HTML)
          if grep -q '"campaigns":{' campaign-os/cockpit-operational.html; then
            echo "V2 schema: FOUND"
          else
            echo "V2 schema: MISSING"
            exit 1
          fi

          # Check all campaigns present
          for camp in trackman-intelligence takomo-101t winter-golf; do
            echo -n "$camp: "
            if grep -q "$camp" campaign-os/cockpit-operational.html; then
              echo "FOUND"
            else
              echo "MISSING"
            fi
          done

          # No undefined values
          UNDEF=$(grep -o 'undefined' campaign-os/cockpit-operational.html | wc -l)
          echo "undefined count: $UNDEF"

          # Portfolio JS functions
          for check in showView selectCampaign Updated; do
            echo -n "$check: "
            if grep -q "$check" campaign-os/cockpit-operational.html; then
              echo "FOUND"
            else
              echo "MISSING"
            fi
          done

          # Size check
          if [ "$FILE_SIZE" -lt 35000 ]; then
            echo "File too small — incomplete generation"
            exit 1
          fi

          echo "All checks passed"

      - name: Upload artifact for Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment success
        run: |
          echo "Deployment ID: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Live URL: https://clawdiavector.github.io/swing-shack-dashboard/campaign-os/cockpit-operational.html"