name: Deploy to GitHub Pages + Cockpit Regeneration

on:
  push:
    branches: [main]
    paths:
      - 'campaign-os/**'
      - 'scripts/**'
      - 'campaign-data-staged.json'
      - '_config.yml'
      - '.github/workflows/**'
  schedule:
    # Run at 6am, 12pm, 6pm, 9pm SAST (UTC+2 = 4am, 10am, 4pm, 7pm UTC)
    - cron: '0 4,10,16,19 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://clawdiavector.github.io/swing-shack-dashboard
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campaign-os/
            scripts/
            campaign-data-staged.json
            campaign-os/campaign-data.json
            _config.yml
            .github/
          sparse-checkout-cone-mode: false
          # Need full history for commit detection
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Patch cockpit with real assets from campaign-data.json
        run: |
          node scripts/patch-cockpit.js campaign-os/cockpit-operational.html campaign-os/campaign-data.json

      - name: Verify cockpit has correct data
        run: |
          echo "=== Cockpit Verification ==="
          GREEN=$(grep -o 'cc-num green\">[0-9]*' campaign-os/cockpit-operational.html | head -1 | grep -o '[0-9]*')
          AMBER=$(grep -o 'cc-num amber\">[0-9]*' campaign-os/cockpit-operational.html | head -1 | grep -o '[0-9]*')
          RED=$(grep -o 'cc-num red\">[0-9]*' campaign-os/cockpit-operational.html | head -1 | grep -o '[0-9]*')
          echo "cc-num green: $GREEN"
          echo "cc-num amber: $AMBER"
          echo "cc-num red: $RED"
          if grep -q "Takomo 101T — Product Research" campaign-os/cockpit-operational.html; then
            echo "Takomo Research: FOUND"
          fi
          if grep -q "Takomo 101T — Hook A" campaign-os/cockpit-operational.html; then
            echo "Takomo Hook A: FOUND"
          fi
          if grep -q "Takomo 101T — Hero Visual" campaign-os/cockpit-operational.html; then
            echo "Takomo Hero Visual: FOUND"
          fi
          if grep -q "Takomo 101T — Full Production Package" campaign-os/cockpit-operational.html; then
            echo "Takomo Production Package: FOUND"
          fi
          echo "File size: $(wc -c < campaign-os/cockpit-operational.html) bytes"

      - name: Commit patched cockpit directly to repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add campaign-os/cockpit-operational.html
          if git diff --cached --quiet; then
            echo "No changes to commit — cockpit already patched"
          else
            git commit -m "ci: patch cockpit with latest campaign data [skip ci]"
            git push origin main
            echo "Patched cockpit committed to repo"
          fi

      - name: Upload artifact for Pages deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment success
        run: |
          echo "Deployment ID: ${{ steps.deployment.outputs.page_url }}"
          echo "Deployed at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Live URL: https://clawdiavector.github.io/swing-shack-dashboard/campaign-os/cockpit-operational.html"