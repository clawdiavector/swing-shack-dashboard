name: Deploy to GitHub Pages + Cockpit Regeneration

on:
  push:
    branches: [main]
    paths:
      - 'campaign-os/**'
      - 'scripts/**'
      - 'campaign-data-staged.json'
  schedule:
    # Run at 6am, 12pm, 6pm, 9pm SAST (UTC+2 = 4am, 10am, 4pm, 7pm UTC)
    - cron: '0 4,10,16,19 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://clawdiavector.github.io/swing-shack-dashboard
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            campaign-os/
            scripts/
            campaign-data-staged.json
            campaign-os/campaign-data.json
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Patch cockpit with campaign assets
        run: |
          node scripts/patch-cockpit.js campaign-os/cockpit-operational.html campaign-os/campaign-data.json

      - name: Regenerate cockpit from campaign-data.json
        run: |
          python3 scripts/regenerate-cockpit.py
          echo "Cockpit regenerated"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify cockpit was generated
        run: |
          if [ -f campaign-os/cockpit-operational.html ]; then
            echo "cockpit-operational.html: $(wc -c < campaign-os/cockpit-operational.html) bytes"
            echo "Cockpit regeneration: SUCCESS"
          else
            echo "ERROR: cockpit-operational.html not found after regeneration"
            exit 1
          fi