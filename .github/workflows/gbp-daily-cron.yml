name: GBP Daily cron tick (06:00 SAST)

on:
  schedule:
    # 04:00 UTC = 06:00 SAST. GitHub Actions cron uses UTC.
    - cron: '0 4 * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/jobs/run/gbp_tick on Railway
        env:
          COS_JOB_TOKEN: ${{ secrets.COS_JOB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COS_JOB_TOKEN:-}" ]; then
            echo "::error::COS_JOB_TOKEN secret is not set — refuse to fall back to password login"
            exit 1
          fi
          curl -sf -X POST "https://swing-shack-dashboard-production.up.railway.app/api/jobs/run/gbp_tick" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            | tee /tmp/job-run.json
          echo
          python3 -c "import json,sys; d=json.load(open('/tmp/job-run.json')); sys.exit(0 if d.get('ok') else 1)"
          echo "gbp_tick fired. Output above."
