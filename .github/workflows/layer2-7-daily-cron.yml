name: Layer 2–7 daily cron (07:15 SAST)

# Fires L2 Health, L5 Create, L6 Publish (sandbox), and L7 Learn jobs on Railway.
# Runs after layer1-daily-cron.yml (07:00 SAST) so insights/data are fresh first.
#
# Schedule: 05:15 UTC = 07:15 SAST
# Auth: COS_JOB_TOKEN bearer (same secret as other job workflows).

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

jobs:
  layer2-7-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COS_JOB_TOKEN: ${{ secrets.COS_JOB_TOKEN }}
      BASE: https://swing-shack-dashboard-production.up.railway.app
    steps:
      - name: Preflight — COS_JOB_TOKEN required
        run: |
          set -euo pipefail
          if [ -z "${COS_JOB_TOKEN:-}" ]; then
            echo "::error::COS_JOB_TOKEN secret is not set — refuse to fall back to password login"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: L2 — slot_planner
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/slot_planner" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/slot_planner.json
          python3 scripts/cos_job_summary.py print /tmp/slot_planner.json

      - name: L2 — agent_queue_writer
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/agent_queue_writer" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/agent_queue_writer.json
          python3 scripts/cos_job_summary.py print /tmp/agent_queue_writer.json

      - name: L2 — review_sla
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/review_sla" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/review_sla.json
          python3 scripts/cos_job_summary.py print /tmp/review_sla.json

      - name: L2 — holiday_inject
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/holiday_inject?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/holiday_inject.json
          python3 scripts/cos_job_summary.py print /tmp/holiday_inject.json

      - name: L2 — data_archive
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/data_archive" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/data_archive.json
          python3 scripts/cos_job_summary.py print /tmp/data_archive.json

      - name: L5 — retry_failed_images
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/retry_failed_images?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/retry_failed_images.json
          python3 scripts/cos_job_summary.py print /tmp/retry_failed_images.json

      - name: L5 — draft_assets
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/draft_assets?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/draft_assets.json
          python3 scripts/cos_job_summary.py print /tmp/draft_assets.json

      - name: L5 — krea_poll_draft_images
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/krea_poll_draft_images?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/krea_poll_draft_images.json
          python3 scripts/cos_job_summary.py print /tmp/krea_poll_draft_images.json

      - name: L5 — asset_qc
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/asset_qc?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/asset_qc.json
          python3 scripts/cos_job_summary.py print /tmp/asset_qc.json

      - name: L6 — publish_dispatch
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/publish_dispatch?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/publish_dispatch.json
          python3 scripts/cos_job_summary.py print /tmp/publish_dispatch.json

      - name: L7 — post_outcomes
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/post_outcomes?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/post_outcomes.json
          python3 scripts/cos_job_summary.py print /tmp/post_outcomes.json

      - name: L7 — winner_promotion
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/winner_promotion?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/winner_promotion.json
          python3 scripts/cos_job_summary.py print /tmp/winner_promotion.json

      - name: L7 — proposal_outcome
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/proposal_outcome?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/proposal_outcome.json
          python3 scripts/cos_job_summary.py print /tmp/proposal_outcome.json

      - name: L7 — human_edit_signal
        continue-on-error: true
        run: |
          set -euo pipefail
          curl -sf -X POST "$BASE/api/jobs/run/human_edit_signal?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/human_edit_signal.json
          python3 scripts/cos_job_summary.py print /tmp/human_edit_signal.json

      - name: Summary — L2–L7 job verdicts
        run: |
          set -euo pipefail
          curl -sf "$BASE/api/jobs/digest" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -o /tmp/digest.json
          python3 -c "
          import json
          names = [
              'slot_planner','agent_queue_writer','review_sla','holiday_inject','data_archive',
              'retry_failed_images','draft_assets','krea_poll_draft_images','asset_qc','publish_dispatch',
              'post_outcomes','winner_promotion','proposal_outcome','human_edit_signal',
          ]
          d = json.load(open('/tmp/digest.json'))
          by_name = {j.get('name'): j for j in d.get('jobs', [])}
          for n in names:
              j = by_name.get(n, {})
              print(f\"  {j.get('verdict','?'):<7} {n}\")
          "
