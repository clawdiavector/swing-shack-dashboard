name: Mail intake (Herman's mail, every 30 minutes)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:  # manual trigger for testing

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: POST /api/jobs/run/mail_intake on Railway
        env:
          COS_JOB_TOKEN: ${{ secrets.COS_JOB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COS_JOB_TOKEN:-}" ]; then
            echo "::error::COS_JOB_TOKEN secret is not set — refuse to fall back to password login"
            exit 1
          fi
          curl -sf -X POST "https://swing-shack-dashboard-production.up.railway.app/api/jobs/run/mail_intake"             -H "Authorization: Bearer ${COS_JOB_TOKEN}"             -H "Content-Type: application/json"             | tee /tmp/job-run.json
          echo
          python3 scripts/cos_job_summary.py print /tmp/job-run.json
          python3 scripts/cos_job_summary.py assert-ok /tmp/job-run.json --hard-gate
