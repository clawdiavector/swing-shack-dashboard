name: Layer 1 daily cron (07:00 SAST)

# Fires Layer 1 daily jobs not covered by meta-live-fetch.yml or gbp-daily-cron.yml.
# reddit_trends disabled 2026-09-18 (Reddit 429 rate limits).
# meta_refresh (12h) and gbp_tick (06:00 SAST) have their own workflows.
#
# Schedule: 05:00 UTC = 07:00 SAST — after gbp_tick, before morning brief digest.
# Auth: COS_JOB_TOKEN bearer (same secret as other job workflows).

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  layer1-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      COS_JOB_TOKEN: ${{ secrets.COS_JOB_TOKEN }}
      BASE: https://swing-shack-dashboard-production.up.railway.app
    steps:
      - name: Preflight — COS_JOB_TOKEN required
        run: |
          set -euo pipefail
          if [ -z "${COS_JOB_TOKEN:-}" ]; then
            echo "::error::COS_JOB_TOKEN secret is not set — refuse to fall back to password login"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Wave 1 — golf_news
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/golf_news ==="
          curl -sf -X POST "$BASE/api/jobs/run/golf_news" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/golf_news.json
          python3 scripts/cos_job_summary.py print /tmp/golf_news.json

      - name: Wave 1 — seo_rankings
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/seo_rankings ==="
          curl -sf -X POST "$BASE/api/jobs/run/seo_rankings?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/seo_rankings.json
          python3 scripts/cos_job_summary.py print /tmp/seo_rankings.json

      - name: Wave 1 — ga4_report
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/ga4_report ==="
          curl -sf -X POST "$BASE/api/jobs/run/ga4_report?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/ga4_report.json
          python3 scripts/cos_job_summary.py print /tmp/ga4_report.json
          python3 scripts/cos_job_summary.py assert-ok /tmp/ga4_report.json --hard-gate

      - name: Wave 1 — windsor_refresh
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/windsor_refresh ==="
          curl -sf -X POST "$BASE/api/jobs/run/windsor_refresh?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/windsor_refresh.json
          python3 scripts/cos_job_summary.py print /tmp/windsor_refresh.json

      - name: Wave 1 — gsc_report
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/gsc_report ==="
          curl -sf -X POST "$BASE/api/jobs/run/gsc_report?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/gsc_report.json
          python3 scripts/cos_job_summary.py print /tmp/gsc_report.json

      - name: Wave 1 — booking_truth
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/booking_truth ==="
          curl -sf -X POST "$BASE/api/jobs/run/booking_truth?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/booking_truth.json
          python3 scripts/cos_job_summary.py print /tmp/booking_truth.json

      - name: Wave 1 — competitor_tracker (Mondays only)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "$(date -u +%u)" != "1" ]; then
            echo "Skip competitor_tracker — weekly job (runs Mondays UTC)"
            exit 0
          fi
          echo "=== POST /api/jobs/run/competitor_tracker ==="
          curl -sf -X POST "$BASE/api/jobs/run/competitor_tracker?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/competitor_tracker.json
          python3 scripts/cos_job_summary.py print /tmp/competitor_tracker.json

      - name: Wave 1 — site_audit
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/site_audit ==="
          curl -sf -X POST "$BASE/api/jobs/run/site_audit?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/site_audit.json
          python3 scripts/cos_job_summary.py print /tmp/site_audit.json

      - name: Wave 1 — freshness_scan
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/freshness_scan ==="
          curl -sf -X POST "$BASE/api/jobs/run/freshness_scan" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/freshness_scan.json
          python3 scripts/cos_job_summary.py print /tmp/freshness_scan.json

      - name: Wave 2 — youtube_trends
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/youtube_trends ==="
          curl -sf -X POST "$BASE/api/jobs/run/youtube_trends" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/youtube_trends.json
          python3 scripts/cos_job_summary.py print /tmp/youtube_trends.json

      - name: Wave 3 — insights_hooks
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/insights_hooks ==="
          curl -sf -X POST "$BASE/api/jobs/run/insights_hooks?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/insights_hooks.json
          python3 scripts/cos_job_summary.py print /tmp/insights_hooks.json
          python3 scripts/cos_job_summary.py assert-ok /tmp/insights_hooks.json --hard-gate

      - name: Wave 3b — post_conversion_score
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/post_conversion_score ==="
          curl -sf -X POST "$BASE/api/jobs/run/post_conversion_score?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/post_conversion_score.json
          python3 scripts/cos_job_summary.py print /tmp/post_conversion_score.json

      - name: Wave 4 — insights_reco
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/insights_reco ==="
          curl -sf -X POST "$BASE/api/jobs/run/insights_reco?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/insights_reco.json
          python3 scripts/cos_job_summary.py print /tmp/insights_reco.json
          python3 scripts/cos_job_summary.py assert-ok /tmp/insights_reco.json --hard-gate

      - name: Wave 5 — content_ideas_refresh
        continue-on-error: true
        run: |
          set -euo pipefail
          echo "=== POST /api/jobs/run/content_ideas_refresh ==="
          curl -sf -X POST "$BASE/api/jobs/run/content_ideas_refresh?all=1" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -H "Content-Type: application/json" \
            -o /tmp/content_ideas_refresh.json
          python3 scripts/cos_job_summary.py print /tmp/content_ideas_refresh.json

      - name: Summary — GET /api/jobs/digest
        run: |
          set -euo pipefail
          echo "=== GET /api/jobs/digest ==="
          curl -sf "$BASE/api/jobs/digest" \
            -H "Authorization: Bearer ${COS_JOB_TOKEN}" \
            -o /tmp/digest.json
          python3 -c "
          import json
          d = json.load(open('/tmp/digest.json'))
          jobs = d.get('jobs', [])
          counts = {}
          for j in jobs:
              v = j.get('verdict', '?')
              counts[v] = counts.get(v, 0) + 1
          print('Verdicts:', counts)
          for j in sorted(jobs, key=lambda x: x.get('name', '')):
              print(f\"  {j.get('verdict','?'):<7} {j.get('name','?')}\")
          "
