name: Meta Live Fetch (IG + FB analytics refresh)

# Hits the live Railway job registry so analytics JSONs land on the
# runtime volume (no git commit dance).
#
# POST /api/jobs/run/meta_refresh → _lib.meta_live_fetch.fetch_all()
# writes (under $DATA_DIR):
#   - ig-analytics.json
#   - ig-business-analytics.json
#   - facebook-analytics.json
#   - facebook-business-analytics.json
#
# Schedule:
#   - 06:30 SAST (04:30 UTC) — before morning brief
#   - 18:30 SAST (16:30 UTC) — afternoon refresh
# Auth: COS_JOB_TOKEN bearer (additive; no CAMPAIGN_OS_AUTH rotation).

on:
  schedule:
    - cron: '30 4,16 * * *'  # 06:30 SAST + 18:30 SAST
  workflow_dispatch:           # manual trigger from /api/admin/meta/refresh-now
  push:
    branches: [main]
    paths:
      - 'campaign-os/app.py'
      - 'campaign-os/_lib/meta_live_fetch.py'
      - 'campaign-os/_lib/jobs/**'
      - '.github/workflows/meta-live-fetch.yml'

jobs:
  refresh-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST /api/jobs/run/meta_refresh on Railway
        env:
          COS_JOB_TOKEN: ${{ secrets.COS_JOB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COS_JOB_TOKEN:-}" ]; then
            echo "::error::COS_JOB_TOKEN secret is not set — refuse to fall back to password login"
            exit 1
          fi
          AUTH_H="Authorization: Bearer ${COS_JOB_TOKEN}"
          BASE="https://swing-shack-dashboard-production.up.railway.app"

          echo "=== POST /api/jobs/run/meta_refresh ==="
          curl -sf -X POST "$BASE/api/jobs/run/meta_refresh" \
            -H "$AUTH_H" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -o /tmp/meta-fetch.json
          cat /tmp/meta-fetch.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'ok={d.get(\"ok\")} status={d.get(\"status\", \"?\")} run_id={d.get(\"run_id\", \"?\")}')
          print(f'rows={d.get(\"rows\", \"?\")} duration_s={d.get(\"duration_s\", \"?\")}')
          "

          echo
          echo "=== POST /api/freshness/refresh ==="
          curl -sf -X POST "$BASE/api/freshness/refresh" \
            -H "$AUTH_H" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -o /tmp/freshness.json

          echo
          echo "=== GET /api/freshness ==="
          curl -sf "$BASE/api/freshness" -H "$AUTH_H" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'ts={d.get(\"ts\", d.get(\"scanned_at\", d.get(\"generated\", \"?\")))}')
          print(f'fresh={d.get(\"fresh_count\", \"?\")}')
          print(f'stale={d.get(\"stale_count\", \"?\")}')
          print(f'rotten={d.get(\"rotten_count\", \"?\")}')
          "

          python3 -c "import json,sys; d=json.load(open('/tmp/meta-fetch.json')); sys.exit(0 if d.get('ok') else 1)"
