name: Meta Live Fetch (IG + FB analytics refresh)

# Built 2026-09-02. Hits the live Railway endpoint so the analytics
# JSONs land directly on the runtime volume (no git commit dance).
#
# The endpoint /api/meta/fetch in campaign-os/app.py calls
# _lib.meta_live_fetch.fetch_all() which pulls from Meta Graph API
# using META_SYSTEM_USER_TOKEN and writes:
#   - data/ig-analytics.json
#   - data/ig-business-analytics.json
#   - data/facebook-analytics.json
#   - data/facebook-business-analytics.json
#
# Schedule:
#   - 06:30 SAST (04:30 UTC) — before morning brief
# Last nudged: 2026-09-02 (Railway auto-deploy watch)
#   - 18:30 SAST (16:30 UTC) — afternoon refresh
# This guarantees the morning brief at 06:00 SAST and the evening
# weekly report builder always see fresh Meta data.

on:
  schedule:
    - cron: '30 4,16 * * *'  # 06:30 SAST + 18:30 SAST
  workflow_dispatch:           # manual trigger from /api/admin/meta/refresh-now
  push:
    branches: [main]
    paths:
      - 'campaign-os/app.py'
      - 'campaign-os/_lib/meta_live_fetch.py'
      - '.github/workflows/meta-live-fetch.yml'

jobs:
  refresh-meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/meta/fetch on Railway
        env:
          CAMPAIGN_OS_AUTH: ${{ secrets.CAMPAIGN_OS_AUTH }}
        run: |
          set -e
          # Get session cookie via shared-password login
          COOKIE_JAR=$(mktemp)
          trap "rm -f $COOKIE_JAR" EXIT
          curl -s -c "$COOKIE_JAR" -X POST "https://swing-shack-dashboard-production.up.railway.app/login" \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "password=$CAMPAIGN_OS_AUTH" \
            -o /dev/null
          # Fire the Meta fetch. /api/meta/fetch is the live puller.
          # It hits Meta Graph API in-process and writes 4 JSONs to
          # the Railway runtime volume (/data/campaign-os/data/).
          echo "=== POST /api/meta/fetch ==="
          curl -s -b "$COOKIE_JAR" -X POST "https://swing-shack-dashboard-production.up.railway.app/api/meta/fetch" \
            -H "Content-Type: application/json" \
            -d '{}' \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -o /tmp/meta-fetch.json
          cat /tmp/meta-fetch.json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'ok={d.get(\"ok\")} token_kind={d.get(\"token_kind\", \"?\")}')
          print(f'ig_followers={d.get(\"ig_followers\", \"?\")}')
          print(f'ig_posts={d.get(\"ig_posts\", \"?\")}')
          print(f'fb_fan_count={d.get(\"fb_fan_count\", \"?\")}')
          print(f'fb_posts={d.get(\"fb_posts\", \"?\")}')
          # Surface the 30-day FB page metric so we know the pull landed
          fb = d.get('fb_page_metrics_30d', {})
          if fb:
              for metric, block in fb.items():
                  print(f'fb.{metric}.total_30d={block.get(\"total_30d\", \"?\")}')
          "
          # Also refresh freshness.json so /api/freshness stops returning
          # the stale 2026-08-20 snapshot. data_freshness_check.js runs
          # the scan on Railway and updates /data/campaign-os/data/freshness.json
          echo
          echo "=== POST /api/freshness/refresh ==="
          curl -s -b "$COOKIE_JAR" -X POST "https://swing-shack-dashboard-production.up.railway.app/api/freshness/refresh" \
            -H "Content-Type: application/json" \
            -w "\nHTTP %{http_code} in %{time_total}s\n" \
            -o /tmp/freshness.json || echo "(freshness/refresh endpoint not present — skipping)"
          # Final summary — re-read /api/freshness to confirm freshness.json
          # is now updated to today.
          echo
          echo "=== GET /api/freshness ==="
          curl -s -b "$COOKIE_JAR" "https://swing-shack-dashboard-production.up.railway.app/api/freshness" \
            | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'ts={d.get(\"ts\", \"?\")}')
          print(f'fresh={d.get(\"fresh_count\", \"?\")}')
          print(f'stale={d.get(\"stale_count\", \"?\")}')
          print(f'rotten={d.get(\"rotten_count\", \"?\")}')
          "
          # Fail loud if the Meta fetch returned ok=false
          if grep -q '"ok":\s*false' /tmp/meta-fetch.json; then
            echo "::error::Meta fetch returned ok=false — see /tmp/meta-fetch.json"
            exit 1
          fi