<!DOCTYPE html>
<html>
<head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
        font-family: 'Montserrat', sans-serif;
        width: 1080px;
        height: 1350px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    .bg {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: url('https://clawdiavector.github.io/swing-shack-dashboard/media/inbound/b00af764-4d4f-4ce6-91ea-7c0803e38a46.jpg') center/cover;
        filter: blur(3px) brightness(0.3);
    }
    
    .overlay {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(13, 13, 13, 0.7);
    }
    
    .content { position: relative; z-index: 1; }
    
    .slogan { font-size: 22px; color: #e94560; letter-spacing: 4px; margin-bottom: 15px; }
    .logo img { width: 150px; height: 150px; object-fit: contain; margin-bottom: 10px; }
    .brand-name { font-family: 'Bebas Neue', sans-serif; font-size: 85px; color: #fff; letter-spacing: 5px; margin-bottom: 5px; }
    
    .headline { font-family: 'Bebas Neue', sans-serif; font-size: 130px; color: #fff; text-transform: uppercase; line-height: 0.95; margin-bottom: 15px; }
    .headline span { color: #e94560; }
    
    .hook { font-size: 28px; color: #fff; margin-bottom: 25px; font-weight: 700; }
    .hook span { color: #e94560; }
    
    .value { font-size: 20px; color: #ccc; margin-bottom: 30px; line-height: 1.5; }
    
    .cta-box { background: #e94560; padding: 22px 60px; border-radius: 5px; display: inline-block; }
    .cta { font-size: 26px; color: #fff; font-weight: 900; letter-spacing: 2px; }
    .website { margin-top: 25px; font-size: 18px; color: #888; }
    .line { width: 50px; height: 3px; background: #e94560; margin: 15px auto; }
</style>
</head>
<body>
    <div class="bg"></div>
    <div class="overlay"></div>
    <div class="content">
        <div class="slogan">Real Golf, Indoors</div>
        <div class="logo"><img src="https://clawdiavector.github.io/swing-shack-dashboard/media/inbound/6cc971f6-fe07-4db0-9030-3353a4cd1a24.png"></div>
        <div class="brand-name">SWING SHACK</div>
        
        <div class="headline">GET<br><span>FIT</span></div>
        <div class="line"></div>
        <div class="hook"><span>Clubs That Fit Your Swing</span></div>
        <div class="value">When your clubs fit your swing, golf feels effortless</div>
        
        <div class="cta-box"><div class="cta">BOOK A FITTING</div></div>
        <div class="website">swingshack.co.za</div>
    </div>
</body>
</html>
