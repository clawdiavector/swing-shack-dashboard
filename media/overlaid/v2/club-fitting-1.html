<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
        font-family: 'Montserrat', sans-serif;
        width: 1080px;
        height: 1350px;
        background: linear-gradient(145deg, #0d0d0d 0%, #16213e 100%);
        position: relative;
        overflow: hidden;
    }
    
    body::before {
        content: '';
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: radial-gradient(circle at 50% 50%, rgba(233, 69, 96, 0.15) 0%, transparent 70%);
    }
    
    .centered {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 100%;
    }
    
    .slogan { 
        font-size: 22px; 
        color: #e94560; 
        letter-spacing: 4px; 
        margin-bottom: 15px; 
        text-transform: uppercase;
    }
    
    .logo { 
        width: 150px; 
        height: 150px; 
        margin: 0 auto 10px;
    }
    .logo img { 
        width: 100%; 
        height: 100%; 
        object-fit: contain; 
    }
    
    .brand-name { 
        font-family: 'Bebas Neue', sans-serif; 
        font-size: 85px; 
        color: #fff; 
        letter-spacing: 5px; 
        margin-bottom: 5px; 
    }
    
    .headline { 
        font-family: 'Bebas Neue', sans-serif; 
        font-size: 130px; 
        color: #fff; 
        text-transform: uppercase; 
        line-height: 0.95; 
        margin-bottom: 15px; 
    }
    .headline span { color: #e94560; }
    
    .line { 
        width: 50px; 
        height: 3px; 
        background: #e94560; 
        margin: 15px auto; 
    }
    
    .hook { 
        font-size: 28px; 
        color: #fff; 
        margin-bottom: 25px; 
        font-weight: 700; 
    }
    .hook span { color: #e94560; }
    
    .value { 
        font-size: 20px; 
        color: #aaa; 
        margin-bottom: 30px; 
        line-height: 1.5; 
    }
    
    .cta-box { 
        background: #e94560; 
        padding: 22px 60px; 
        border-radius: 5px; 
        display: inline-block;
    }
    .cta { 
        font-size: 26px; 
        color: #fff; 
        font-weight: 900; 
        letter-spacing: 2px; 
    }
    .website { 
        margin-top: 25px; 
        font-size: 18px; 
        color: #666; 
    }
</style>
</head>
<body>
    <div class="centered">
        <div class="slogan">Real Golf, Indoors</div>
        <div class="logo"><img src="https://clawdiavector.github.io/swing-shack-dashboard/media/inbound/6cc971f6-fe07-4db0-9030-3353a4cd1a24.png"></div>
        <div class="brand-name">SWING SHACK</div>
        
        <div class="headline">GET<br><span>FIT</span></div>
        <div class="line"></div>
        <div class="hook"><span>Golf, Made Personal</span></div>
        <div class="value">Precision-built clubs crafted to your unique swing DNA</div>
        
        <div class="cta-box"><div class="cta">GET FIT</div></div>
        <div class="website">swingshack.co.za</div>
    </div>
</body>
</html>
