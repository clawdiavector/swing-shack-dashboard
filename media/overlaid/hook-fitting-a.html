<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkSystemFont,'Segoe UI',sans-serif}
.container{width:1080px;height:1920px;background:linear-gradient(180deg,#0a0a0f 0%,#141428 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;text-align:center}
.headline{font-size:120px;font-weight:800;color:#fff;letter-spacing:-4px;line-height:1.1;margin-bottom:40px}
.sub{font-size:36px;color:#00d4ff;font-weight:500;letter-spacing:8px;text-transform:uppercase;margin-bottom:60px}
.footer{font-size:28px;color:#666;letter-spacing:6px;position:absolute;bottom:120px}
</style>
</head>
<body>
<div class="container">
<div class="headline">YOUR STATS<br>DON'T LIE</div>
<div class="sub">TRACKMAN</div>
<div class="footer">SWING SHACK · JOHANNESBURG</div>
</div>
</body>
</html>
