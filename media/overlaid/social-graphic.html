<!DOCTYPE html>
<html>
<head>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;700;900&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body { 
        font-family: 'Montserrat', sans-serif;
        background: linear-gradient(145deg, #0d0d0d 0%, #2a1a1a 100%);
        width: 1080px;
        height: 1350px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        position: relative;
        overflow: hidden;
    }
    
    body::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
            radial-gradient(circle at 30% 70%, rgba(243, 156, 18, 0.2) 0%, transparent 50%),
            radial-gradient(circle at 70% 30%, rgba(243, 156, 18, 0.1) 0%, transparent 40%);
        pointer-events: none;
    }
    
    .slogan {
        font-size: 24px;
        color: #f39c12;
        letter-spacing: 4px;
        margin-bottom: 15px;
        text-transform: uppercase;
    }
    
    .logo img {
        width: 160px;
        height: 160px;
        object-fit: contain;
        margin-bottom: 10px;
    }
    
    .brand-name {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 90px;
        color: #ffffff;
        letter-spacing: 6px;
        margin-bottom: 5px;
    }
    
    .tagline {
        font-size: 18px;
        color: #666666;
        margin-bottom: 35px;
    }
    
    .headline {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 120px;
        color: #ffffff;
        text-transform: uppercase;
        line-height: 0.95;
        margin-bottom: 20px;
    }
    
    .headline span {
        color: #f39c12;
    }
    
    .value-points {
        font-size: 22px;
        color: #cccccc;
        margin-bottom: 30px;
        line-height: 1.5;
    }
    
    .value-points strong {
        color: #f39c12;
    }
    
    .cta-box {
        background: #f39c12;
        padding: 25px 70px;
        border-radius: 5px;
    }
    
    .cta {
        font-size: 28px;
        color: #ffffff;
        font-weight: 900;
        letter-spacing: 3px;
    }
    
    .website {
        margin-top: 30px;
        font-size: 20px;
        color: #666666;
    }
    
    .line {
        width: 60px;
        height: 3px;
        background: #f39c12;
        margin: 20px auto;
    }
</style>
</head>
<body>
    <div class="slogan">Real Golf, Indoors</div>
    
    <div class="logo">
        <img src="https://clawdiavector.github.io/swing-shack-dashboard/media/inbound/6cc971f6-fe07-4db0-9030-3353a4cd1a24.png" alt="Swing Shack Logo">
    </div>
    
    <div class="brand-name">SWING SHACK</div>
    <div class="tagline">The Place Good Golfers Go To Get Better</div>
    
    <div class="headline">PLAY<br><span>TOGETHER</span></div>
    
    <div class="line"></div>
    
    <div class="value-points">
        <strong>Social Golf & Fun Leagues</strong><br>
        Great drinks, competition & community
    </div>
    
    <div class="cta-box">
        <div class="cta">BOOK A GROUP</div>
    </div>
    
    <div class="website">swingshack.co.za</div>
</body>
</html>
