
<!DOCTYPE html>
<html>
<head>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: 'Arial Black', sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        width: 1080px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
    }
    .logo {
        font-size: 80px;
        color: #e94560;
        margin-bottom: 40px;
        font-weight: 900;
    }
    .headline {
        font-size: 120px;
        color: #ffffff;
        text-transform: uppercase;
        margin-bottom: 30px;
        font-weight: 900;
        text-shadow: 4px 4px 0 #e94560;
    }
    .subtext {
        font-size: 50px;
        color: #cccccc;
        margin-bottom: 60px;
    }
    .cta {
        font-size: 40px;
        color: #e94560;
        padding: 20px 60px;
        border: 3px solid #e94560;
        border-radius: 10px;
    }
    .brand {
        position: absolute;
        bottom: 40px;
        font-size: 30px;
        color: #666;
    }
</style>
</head>
<body>
    <div class="logo">⛳ SWING SHACK</div>
    <div class="headline">GET FITTED</div>
    <div class="subtext">TrackMan Precision</div>
    <div class="cta">swingshack.co.za</div>
    <div class="brand">The Place Good Golfers Go To Get Better</div>
</body>
</html>
