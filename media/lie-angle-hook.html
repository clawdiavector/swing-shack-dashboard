<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lie Angle Hook</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Source+Sans+3:wght@300;400;600&display=swap');
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 1080px;
      height: 1350px;
      background: linear-gradient(145deg, #0a0a0a 0%, #1a1a2e 50%, #0f0f1a 100%);
      font-family: 'Source Sans 3', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    /* Background pattern */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 80%, rgba(45, 180, 120, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(45, 180, 120, 0.05) 0%, transparent 40%);
      pointer-events: none;
    }
    
    .container {
      width: 100%;
      max-width: 900px;
      padding: 80px;
      text-align: center;
      position: relative;
      z-index: 1;
    }
    
    /* Brand tag */
    .brand-tag {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(45, 180, 120, 0.15);
      border: 1px solid rgba(45, 180, 120, 0.3);
      border-radius: 50px;
      font-family: 'Oswald', sans-serif;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #2db478;
      text-transform: uppercase;
      margin-bottom: 50px;
    }
    
    /* Main headline */
    .headline {
      font-family: 'Oswald', sans-serif;
      font-size: 128px;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 40px;
      text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    
    .headline .highlight {
      color: #2db478;
      display: block;
    }
    
    /* Support line */
    .support {
      font-size: 38px;
      font-weight: 300;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
      margin-bottom: 60px;
      max-width: 800px;
    }
    
    /* Divider */
    .divider {
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, #2db478, transparent);
      margin: 50px auto;
    }
    
    /* Micro text grid */
    .micro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin: 40px 0;
    }
    
    .micro-item {
      text-align: center;
    }
    
    .micro-label {
      font-size: 16px;
      font-weight: 600;
      color: #2db478;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    
    .micro-value {
      font-size: 24px;
      font-weight: 400;
      color: rgba(255,255,255,0.9);
    }
    
    /* CTA */
    .cta {
      margin-top: 60px;
      padding: 24px 60px;
      background: transparent;
      border: 2px solid #2db478;
      border-radius: 8px;
      font-family: 'Oswald', sans-serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #2db478;
      text-transform: uppercase;
    }
    
    /* Footer */
    .footer {
      position: absolute;
      bottom: 40px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 20px;
      color: rgba(255,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-tag">Swing Shack</div>
    
    <div class="headline">
      WHY DO YOUR
      <span class="highlight">GOOD SWINGS</span>
      MISS LEFT?
    </div>
    
    <div class="support">
      Sometimes the issue is not your swing. If lie angle is off, the club can send solid strikes off line.
    </div>
    
    <div class="divider"></div>
    
    <div class="micro-grid">
      <div class="micro-item">
        <div class="micro-label">Lie Angle</div>
        <div class="micro-value">+2°</div>
      </div>
      <div class="micro-item">
        <div class="micro-label">Start Line</div>
        <div class="micro-value">Left</div>
      </div>
      <div class="micro-item">
        <div class="micro-label">Strike Pattern</div>
        <div class="micro-value">Heel</div>
      </div>
      <div class="micro-item">
        <div class="micro-label">Ball Flight</div>
        <div class="micro-value">Pull</div>
      </div>
    </div>
    
    <div class="cta">Book a Fitting</div>
  </div>
  
  <div class="footer">swingshack.co.za</div>
</body>
</html>
