<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Campaign OS</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%230a0f1a%22%2F%3E%3Cpath%20d%3D%22M10%2026V6%22%20stroke%3D%22%23fbbf24%22%20stroke-width%3D%222.5%22%20stroke-linecap%3D%22round%22%2F%3E%3Cpath%20d%3D%22M10%208%20L22%2011%20L10%2014%20Z%22%20fill%3D%22%23fbbf24%22%2F%3E%3Ccircle%20cx%3D%2210%22%20cy%3D%2227%22%20r%3D%221.5%22%20fill%3D%22%2334d399%22%2F%3E%3C%2Fsvg%3E">
<style>
:root {
  --bg: #0c0d10;
  --panel: #16181c;
  --panel-2: #1d2025;
  --line: #2a2d33;
  --text: #e8eaed;
  --muted: #9aa0a6;
  --accent: #c2f64f;
  --accent-2: #4f8eff;
  --warn: #ff6b6b;
  --ok: #42b883;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}
.wrap {
  width: 100%;
  max-width: 380px;
  padding: 24px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 32px 28px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
}
.logo {
  width: 48px;
  height: 48px;
  background: var(--accent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 22px;
  color: #0c0d10;
  margin-bottom: 18px;
}
h1 {
  margin: 0 0 4px;
  font-size: 22px;
  font-weight: 700;
}
.subtitle {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 24px;
}
label {
  display: block;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--muted);
  margin-bottom: 6px;
  font-weight: 600;
}
input[type="password"] {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--text);
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
  font-family: inherit;
}
input[type="password"]:focus {
  border-color: var(--accent);
}
input[type="password"]::placeholder {
  color: #555a62;
}
button {
  width: 100%;
  background: var(--accent);
  color: #0c0d10;
  border: none;
  padding: 13px;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 18px;
  transition: opacity 0.15s;
  font-family: inherit;
}
button:hover { opacity: 0.9; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.error {
  background: rgba(255,107,107,0.1);
  border: 1px solid var(--warn);
  color: var(--warn);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
}
.error.show { display: block; }
.foot {
  text-align: center;
  margin-top: 22px;
  color: var(--muted);
  font-size: 12px;
}
.brand {
  text-align: center;
  margin-top: 16px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">CS</div>
    <h1>Campaign OS</h1>
    <div class="subtitle">Sign in to continue</div>
    <div class="error" id="error"></div>
    <form id="login-form" method="post" action="/login">
      <label for="pw">Password</label>
      <input type="password" id="pw" name="password" placeholder="Enter shared password" autofocus required>
      <button type="submit" id="submit-btn">Sign in</button>
    </form>
    <div class="brand">swing-shack-dashboard</div>
  </div>
  <div class="foot">Private access &middot; Swing Shack internal tool</div>
</div>
<script>
const form = document.getElementById('login-form');
const errBox = document.getElementById('error');
const btn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'Signing in...';
  const pw = document.getElementById('pw').value;
  try {
    const res = await fetch('/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'password=' + encodeURIComponent(pw),
      credentials: 'same-origin'
    });
    if (res.ok || res.redirected) {
      window.location.href = '/';
      return;
    }
    const data = await res.json().catch(() => ({}));
    errBox.textContent = data.error || 'Wrong password. Try again.';
    errBox.classList.add('show');
    document.getElementById('pw').value = '';
    document.getElementById('pw').focus();
  } catch (err) {
    errBox.textContent = 'Network error. Try again.';
    errBox.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>
