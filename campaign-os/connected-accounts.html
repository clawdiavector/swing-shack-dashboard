<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Connected Accounts — Campaign OS</title>
<style>
  :root { color-scheme: dark; --bg: #0a0f1a; --card: #1a1f2c; --border: #2a3142; --tx: #e5e7eb; --muted: #94a3b8; --dim: #64748b; --ac: #fbbf24; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--tx); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 80px; }
  h1 { font-size: 24px; color: var(--ac); margin: 0 0 4px; }
  p.sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; line-height: 1.55; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 20px; }
  .toolbar .meta { flex: 1; color: var(--dim); font-size: 12px; min-width: 140px; }
  a.back { color: var(--muted); font-size: 12px; text-decoration: none; }
  a.back:hover { color: var(--ac); }
  .btn { background: var(--ac); color: var(--bg); font-weight: 700; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
  .btn:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .btn-ghost:hover { color: var(--tx); border-color: #475569; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .sum-pill { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }
  .sum-connected { background: #064e3b; color: #6ee7b7; border-color: #065f46; }
  .sum-partial { background: #78350f; color: #fcd34d; border-color: #92400e; }
  .sum-degraded { background: #7c2d12; color: #fdba74; border-color: #9a3412; }
  .sum-missing { background: #1f2937; color: #94a3b8; }
  .cat { margin-bottom: 28px; }
  .cat-h { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
  .acc { background: var(--card); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .acc summary { list-style: none; cursor: pointer; padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px; user-select: none; }
  .acc summary::-webkit-details-marker { display: none; }
  .acc[open] summary { border-bottom: 1px solid var(--border); }
  .acc-icon { font-size: 26px; line-height: 1; flex-shrink: 0; }
  .acc-main { flex: 1; min-width: 0; }
  .acc-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .acc-purpose { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 0; }
  .acc-meta { font-size: 11px; color: var(--dim); margin-top: 6px; }
  .acc-meta b { color: var(--muted); font-weight: 600; }
  .chev { color: var(--dim); font-size: 12px; margin-top: 4px; transition: transform 0.15s; }
  .acc[open] .chev { transform: rotate(90deg); }
  .acc-body { padding: 14px 16px 16px; font-size: 13px; color: var(--muted); line-height: 1.55; }
  .pill { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .pill-connected { background: #064e3b; color: #6ee7b7; }
  .pill-partial { background: #78350f; color: #fcd34d; }
  .pill-degraded { background: #7c2d12; color: #fdba74; }
  .pill-missing { background: #374151; color: #9ca3af; }
  .pill-err { background: #7f1d1d; color: #fecaca; }
  .channels { display: flex; flex-wrap: wrap; gap: 5px; margin: 10px 0; }
  .chip { background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 3px 8px; font-size: 10px; color: var(--muted); }
  .chip.ok { border-color: #065f46; color: #6ee7b7; }
  .btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .setup h4 { margin: 0 0 6px; font-size: 12px; color: var(--ac); }
  .setup ol { margin: 0 0 12px; padding-left: 20px; }
  .setup li { margin-bottom: 4px; }
  .env-tags { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .env-tag { font-family: ui-monospace, monospace; font-size: 10px; background: var(--bg); border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; color: var(--ac); }
  .err { color: #f87171; font-size: 12px; margin-top: 6px; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 3px; color: var(--ac); font-size: 11px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: #1e293b; border: 1px solid var(--border); padding: 10px 14px; border-radius: 8px; font-size: 13px; z-index: 99; max-width: 360px; display: none; }
  .toast.ok { border-color: #065f46; }
  .toast.err { border-color: #991b1b; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <a class="back" href="/">← Campaign OS</a>
    <div class="meta" id="last-check">Checking…</div>
    <button class="btn btn-ghost" type="button" onclick="loadStatus()">↻ Refresh</button>
  </div>
  <h1>🔌 Connected Accounts</h1>
  <p class="sub">
    Every integration in one place: live status, last successful use, connect actions, and setup steps.
    Status is refreshed on each load (not cached stale pills).
  </p>
  <div class="summary" id="summary"></div>
  <div id="catalog"><div class="acc"><div class="acc-body">Loading…</div></div></div>
</div>
<div class="toast" id="toast"></div>

<script>
function toast(msg, kind) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (kind || '');
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}

function pillClass(state) {
  return 'pill pill-' + (state || 'missing');
}
function pillLabel(state) {
  const m = { connected: 'Connected', partial: 'Partial', degraded: 'Degraded', missing: 'Not set up', err: 'Error' };
  return m[state] || state || 'Unknown';
}

function esc(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderSetup(setup) {
  if (!setup) return '';
  const steps = (setup.steps || []).map(s => '<li>' + esc(s) + '</li>').join('');
  const envs = (setup.env_vars || []).map(e => '<span class="env-tag">' + esc(e) + '</span>').join('');
  return '<div class="setup">'
    + (setup.auth_type ? '<h4>Auth: ' + esc(setup.auth_type) + '</h4>' : '')
    + (envs ? '<div class="env-tags">' + envs + '</div>' : '')
    + (steps ? '<ol>' + steps + '</ol>' : '')
    + '</div>';
}

function renderChannels(details) {
  if (!details || !details.channels || !details.channels.length) return '';
  const chips = details.channels.map(c => {
    const label = c.provider === 'channel' ? ('channel · ' + (c.name || 'unnamed')) : ((c.provider || 'channel') + (c.name ? ' · ' + c.name : ''));
    const cls = c.disabled ? 'chip' : 'chip ok';
    return '<span class="' + cls + '">' + esc(label) + '</span>';
  }).join('');
  return '<div class="channels">' + chips + '</div>'
    + '<div class="acc-meta"><b>' + details.channel_count + '</b> Postiz channel(s)'
    + (details.api_key_prefix ? ' · key <code>' + esc(details.api_key_prefix) + '</code>' : '')
    + (details.api_error ? ' · <span class="err">' + esc(String(details.api_error).slice(0, 120)) + '</span>' : '')
    + '</div>';
}

function renderDetails(item) {
  const d = item.details || {};
  let html = '';
  if (item.id === 'postiz') html += renderChannels(d);
  if (item.id === 'gbp' && d.google_account) html += '<div class="acc-meta">Google account: <b>' + esc(d.google_account) + '</b></div>';
  if (item.id === 'meta') {
    if (d.fan_count != null) html += '<div class="acc-meta">FB fans: <b>' + Number(d.fan_count).toLocaleString() + '</b>' + (d.page_name ? ' (' + esc(d.page_name) + ')' : '') + '</div>';
    if (d.ig_followers != null) html += '<div class="acc-meta">IG followers: <b>' + Number(d.ig_followers).toLocaleString() + '</b>' + (d.ig_handle ? ' (@' + esc(d.ig_handle) + ')' : '') + '</div>';
    if ((d.blockers || []).length) html += '<div class="err">' + d.blockers.map(b => '⚠ ' + esc(b)).join('<br>') + '</div>';
  }
  if (item.error) html += '<div class="err">' + esc(item.error) + '</div>';
  if (item.job_verdict) html += '<div class="acc-meta">Job verdict: <b>' + esc(item.job_verdict) + '</b></div>';
  if (item.summary) html += '<div class="acc-meta">Mode: <b>' + esc(item.summary) + '</b></div>';
  return html;
}

function renderConnect(item) {
  const c = item.connect || {};
  if (!c || c.type === 'none') return c.label ? '<span class="acc-meta">' + esc(c.label) + '</span>' : '';
  if (c.type === 'action' && item.id === 'meta') {
    return '<div class="btn-row"><button class="btn" type="button" id="meta-refresh-btn" onclick="refreshMeta()">🔄 Refresh from Meta</button></div>';
  }
  if (c.url && c.type !== 'action') {
    return '<div class="btn-row"><a class="btn" href="' + esc(c.url) + '">' + esc(c.label || 'Connect') + '</a></div>';
  }
  return '';
}

function renderAccordion(item) {
  const last = item.last_used_label || (item.last_used_at ? item.last_used_at : 'never');
  const open = item.state === 'missing' || item.state === 'degraded' ? ' open' : '';
  return '<details class="acc"' + open + '>'
    + '<summary>'
    + '<span class="acc-icon">' + esc(item.icon || '🔌') + '</span>'
    + '<span class="acc-main">'
    + '<div class="acc-title">' + esc(item.name) + ' <span class="' + pillClass(item.state) + '">' + pillLabel(item.state) + '</span></div>'
    + '<p class="acc-purpose">' + esc(item.purpose || '') + '</p>'
    + '<div class="acc-meta">Last use: <b>' + esc(last) + '</b></div>'
    + '</span>'
    + '<span class="chev">▸</span>'
    + '</summary>'
    + '<div class="acc-body">'
    + renderDetails(item)
    + renderConnect(item)
    + renderSetup(item.setup)
    + '</div>'
    + '</details>';
}

function renderSummary(sum) {
  if (!sum) return '';
  const parts = [];
  if (sum.connected) parts.push('<span class="sum-pill sum-connected">' + sum.connected + ' connected</span>');
  if (sum.partial) parts.push('<span class="sum-pill sum-partial">' + sum.partial + ' partial</span>');
  if (sum.degraded) parts.push('<span class="sum-pill sum-degraded">' + sum.degraded + ' degraded</span>');
  if (sum.missing) parts.push('<span class="sum-pill sum-missing">' + sum.missing + ' not set up</span>');
  return parts.join('');
}

async function refreshMeta() {
  const btn = document.getElementById('meta-refresh-btn');
  if (!btn) return;
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Fetching…';
  try {
    const r = await fetch('/api/meta/fetch', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ brand_id: 'swing-shack' }) });
    const d = await r.json();
    if (d.ok) {
      toast('Meta refreshed: ' + (d.ig_posts || 0) + ' IG posts', 'ok');
      setTimeout(loadStatus, 1200);
    } else {
      toast('Meta refresh failed: ' + (d.error || 'unknown'), 'err');
    }
  } catch (e) {
    toast('Meta refresh failed: ' + e.message, 'err');
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

async function loadStatus() {
  document.getElementById('catalog').innerHTML = '<div class="acc"><div class="acc-body">Loading…</div></div>';
  try {
    const r = await fetch('/api/connected-accounts/status');
    const d = await r.json();
    if (!d.ok) {
      document.getElementById('catalog').innerHTML = '<div class="err">Failed: ' + esc(d.error || 'unknown') + '</div>';
      return;
    }
    document.getElementById('last-check').innerHTML = 'Last checked: <b>' + esc(d.last_check || '—') + '</b>';
    document.getElementById('summary').innerHTML = renderSummary(d.summary);
    const cats = d.categories || [];
    if (!cats.length) {
      document.getElementById('catalog').innerHTML = '<div class="acc-body">No integrations configured.</div>';
      return;
    }
    document.getElementById('catalog').innerHTML = cats.map(cat =>
      '<section class="cat"><h2 class="cat-h">' + esc(cat.label || cat.id) + '</h2>'
      + (cat.items || []).map(renderAccordion).join('')
      + '</section>'
    ).join('');
  } catch (e) {
    document.getElementById('catalog').innerHTML = '<div class="err">Fetch failed: ' + esc(e.message) + '</div>';
  }
}

loadStatus();
</script>
</body>
</html>
