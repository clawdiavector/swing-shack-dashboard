<script>
function renderPortfolio() {
    var container = document.getElementById('portfolio-cards');
    if (!container) return;
    var campaigns = window.campaignData && window.campaignData.campaigns || {};
    var ids = Object.keys(campaigns).sort();
    if (ids.length === 0) {
        container.innerHTML = '<div style="color:#6e6e82;font-size:13px;padding:20px;text-align:center">No campaigns yet. Click "+ Create Campaign" to get started.</div>';
        return;
    }
    var html = '';
    for (var i = 0; i < ids.length; i++) {
        var id = ids[i];
        var c = campaigns[id];
        var ident = c.identity || {};
        var brief = c.brief || {};
        var name = ident.name || id;
        var goal = (ident.primaryGoal || (brief.purpose || '')).slice(0, 80);
        var status = ident.status || 'draft';
        var health = ident.healthState || 'unknown';
        var healthColor = health === 'healthy' ? '#00cc77' : health === 'degraded' ? '#ffaa00' : '#6e6e82';
        var assetCount = (c.assets && Object.keys(c.assets).length) || 0;
        var statusColor = status === 'active' ? '#00cc77' : status === 'draft' ? '#6e6e82' : '#ffaa00';
        html += '<div class="ccard" onclick="selectCampaign(\'' + id + '\')" style="cursor:pointer">' +
            '<div class="ccard-name">' + name + '</div>' +
            '<div class="ccard-meta">' + goal + '</div>' +
            '<div class="ccard-assetcount" style="color:' + healthColor + '">' + assetCount + ' assets &middot; <span style="color:' + statusColor + '">' + status + '</span></div>' +
            '</div>';
    }
    container.innerHTML = html;
}

function openCreateModal() {
    document.getElementById('createModal').classList.add('active');
    document.getElementById('f-name').focus();
}
function closeCreateModal() {
    document.getElementById('createModal').classList.remove('active');
    document.getElementById('createForm').reset();
    document.getElementById('form-error').style.display = 'none';
}
function handleFormSubmit(e) {
  e.preventDefault();
  var required = document.querySelectorAll('#createForm [required]');
  for (var i = 0; i < required.length; i++) {
    if (!required[i].value.trim()) {
      document.getElementById('form-error').textContent = 'Please fill in all required fields.';
      document.getElementById('form-error').style.display = 'block';
      return;
    }
  }

  // Collect platforms
  var platforms = [];
  var platEls = document.querySelectorAll('#createForm input[name="platforms"]:checked');
  for (var p = 0; p < platEls.length; p++) platforms.push(platEls[p].value);

  var formData = {
    name:        document.getElementById('f-name').value.trim(),
    type:        document.getElementById('f-type').value,
    primaryGoal: document.getElementById('f-goal').value.trim(),
    targetAudience: document.getElementById('f-audience').value.trim(),
    primaryOffer:   document.getElementById('f-offer').value.trim(),
    successTarget:  document.getElementById('f-target').value.trim(),
    priority:    document.getElementById('f-priority').value,
    duration:    document.getElementById('f-duration').value,
    platforms:   platforms,
    context:     document.getElementById('f-notes-context').value.trim(),
    notes:       document.getElementById('f-notes').value.trim(),
    sourceType:  document.getElementById('f-source-type').value,
    sourceRef:   document.getElementById('f-source-ref').value.trim(),
    _pending: true,
    _submittedAt: new Date().toISOString()
  };

  document.getElementById('form-error').style.display = 'none';

  // Write to campaign-data-staged.json for agent to pick up
  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/create-campaign', true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    if (xhr.status === 200 || xhr.status === 202) {
      document.getElementById('form-success').textContent = 'Campaign "' + formData.name + '" queued — creating shortly.';
      document.getElementById('form-success').style.display = 'block';
      setTimeout(function() { closeCreateModal(); }, 2200);
    } else {
      document.getElementById('form-error').textContent = 'Failed to submit. Please try again.';
      document.getElementById('form-error').style.display = 'block';
    }
  };
  xhr.onerror = function() {
    // Fallback: write to localStorage and show success
    try {
      var pending = JSON.parse(localStorage.getItem('pendingCampaigns') || '[]');
      pending.push(formData);
      localStorage.setItem('pendingCampaigns', JSON.stringify(pending));
    } catch(e) {}
    document.getElementById('form-success').textContent = 'Campaign "' + formData.name + '" submitted — will be processed shortly.';
    document.getElementById('form-success').style.display = 'block';
    setTimeout(function() { closeCreateModal(); }, 2200);
  };
  xhr.send(JSON.stringify(formData));
}


function renderPipeline(pid) {
    var D = window.campaignData;
    var c = D && D.campaigns && D.campaigns[pid];
    var p = c && c.pipeline;
    if (!p || !p.status) {
        return '<div class="pipeline-bar idle"><div class="pipeline-label idle">Pipeline Status</div><div class="pipeline-step">No active blueprint generation</div><div class="pipeline-agent">Start a campaign to see pipeline progress</div></div>';
    }
    var st = p.status;
    if (st === 'generatingBlueprint') {
        var step = p.currentStep || 1;
        var total = p.totalSteps || 4;
        var agent = p.currentAgent || '---';
        var icons = {Scout:'&#128269;',Copywriter:'&#10000;',ImageGen:'&#127912;',Publisher:'&#128229;',Clawdia:'&#9889;'};
        var icon = icons[agent] || '&#8987;';
        var dots = '';
        for (var i = 0; i < total; i++) {
            dots += '<div class="pipeline-dot' + (i < step - 1 ? ' done' : i === step - 1 ? ' active' : '') + '"></div>';
        }
        return '<div class="pipeline-bar running">' +
            '<div class="pipeline-label running">Generating Blueprint</div>' +
            '<div class="pipeline-step">' + icon + ' ' + agent + ' &#8212; Step ' + step + ' of ' + total + '</div>' +
            '<div class="pipeline-progress">' + dots + '</div>' +
            '<div class="pipeline-dot-label">Campaign Status: <strong style="color:#00cc77">Generating Blueprint</strong></div>' +
            '</div>';
    }
    if (st === 'failed') {
        return '<div class="pipeline-bar failed">' +
            '<div class="pipeline-label failed">Pipeline Failed</div>' +
            '<div class="pipeline-step">Failed at: ' + (p.currentAgent || 'unknown') + '</div>' +
            (p.errorMessage ? '<div class="pipeline-error">Error: ' + p.errorMessage + '</div>' : '') +
            '<a class="pipeline-retry" href="javascript:retryCampaign('' + pid + '')">&#128260; Retry Campaign</a>' +
            '</div>';
    }
    if (st === 'blueprintReady') {
        return '<div class="pipeline-bar ready">' +
            '<div class="pipeline-label ready">Blueprint Ready</div>' +
            '<div class="pipeline-step">&#9989; Campaign blueprint generated</div>' +
            '<div class="pipeline-agent">Ready for production</div>' +
            '</div>';
    }
    return '';
}
function retryCampaign(cid) { alert('Retry: would restart pipeline for campaign ' + cid); }

<div class="modal-overlay" id="createModal">
<div class="modal">
<div class="modal-title">Create Campaign</div><div id="form-error" style="display:none;color:#ff4455;font-size:12px;margin-bottom:12px;padding:8px;background:rgba(255,68,85,0.1);border-radius:6px"></div>
<form id="createForm" onsubmit="handleFormSubmit(event)">
<div class="form-group">
<label class="form-label">Campaign Name *</label>
<input type="text" class="form-input" id="f-name" placeholder="e.g. Winter Golf Promotions 2026" required>
</div>
<div class="form-row">
<div class="form-group">
<label class="form-label">Campaign Type *</label>
<select class="form-select" id="f-type" required>
<option value="">Select type...</option>
<option value="evergreen">Evergreen</option>
<option value="seasonal">Seasonal</option>
<option value="product-launch">Product Launch</option>
<option value="event">Event</option>
<option value="promo">Promo</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Campaign Source Type *</label>
<select class="form-select" id="f-source-type" required>
<option value="">Select source...</option>
<option value="Manual">Manual</option>
<option value="Research Opportunity">Research Opportunity</option>
<option value="Trend">Trend</option>
<option value="Seasonal">Seasonal</option>
<option value="Product Launch">Product Launch</option>
<option value="Competitor Response">Competitor Response</option>
<option value="Customer Request">Customer Request</option>
</select>
</div>
</div>
<div class="form-group">
<label class="form-label">Campaign Source Reference</label>
<input type="text" class="form-input" id="f-source-ref" placeholder="e.g. Reddit thread, competitor site, trend report...">
</div>
<div class="form-row">
<div class="form-group">
<label class="form-label">Primary Goal *</label>
<select class="form-select" id="f-goal" required>
<option value="">Select goal...</option>
<option value="Bookings">Bookings</option>
<option value="Leads">Leads</option>
<option value="Sales">Sales</option>
<option value="Awareness">Awareness</option>
<option value="Event Registrations">Event Registrations</option>
<option value="Memberships">Memberships</option>
<option value="Reviews">Reviews</option>
<option value="Website Traffic">Website Traffic</option>
<option value="Custom">Custom</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Campaign Priority</label>
<select class="form-select" id="f-priority">
<option value="high">High</option>
<option value="medium" selected>Medium</option>
<option value="low">Low</option>
</select>
</div>
</div>
<div class="form-row">
<div class="form-group">
<label class="form-label">Platforms</label>
<select class="form-select" id="f-platforms" multiple style="min-height:80px">
<option value="instagram" selected>Instagram</option>
<option value="tiktok">TikTok</option>
<option value="gmb">Google Business</option>
</select>
</div>
<div class="form-group">
<label class="form-label">Success Target</label>
<input type="text" class="form-input" id="f-target" placeholder="e.g. 10 bookings/week">
</div>
</div>
<div class="form-group">
<label class="form-label">Campaign Duration</label>
<input type="text" class="form-input" id="f-duration" placeholder="e.g. 8 weeks, 3 months, ongoing">
</div>
<div class="form-group">
<label class="form-label">Target Audience</label>
<input type="text" class="form-input" id="f-audience" placeholder="e.g. Beginner to intermediate golfers, 25-55, Johannesburg">
</div>
<div class="form-group">
<label class="form-label">Primary Offer / CTA</label>
<input type="text" class="form-input" id="f-offer" placeholder="e.g. TrackMan Assessment from R900. First session R250.">
</div>
<div class="form-group">
<label class="form-label">Goal Notes</label>
<textarea class="form-textarea" id="f-notes" placeholder="Refine or expand on the primary goal..."></textarea>
</div>
<div class="form-group">
<label class="form-label">Notes / Context</label>
<textarea class="form-textarea" id="f-notes-context" placeholder="Any additional context, references, or notes for the campaign..."></textarea>
</div>
<div class="form-actions">
<button type="button" class="btn-secondary" onclick="closeCreateModal()">Cancel</button>
<button type="submit" class="btn-primary" id="btn-submit">Create Campaign</button>
</div>
</form>
</div>
</div>

</body>
</html>
