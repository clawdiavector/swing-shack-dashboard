safe: true
lsi: false

include:
  - campaign-os/**
  - agents/**
  - data/**
  - docs/**
  - outreach/**
  - research/**
  - scripts/**
  - tiktok-marketing/**
  - "*.html"
  - "*.json"
  - "*.md"
  - "*.txt"
  - "assets/**"
  - "images/**"

exclude:
  - "**/_site/**"
  - "**/.*"
  - "Gemfile*"
  - "package*.json"
  - "node_modules/**"
  - "vendor/**"

# Preserve the patched cockpit — Jekyll processes it but output goes to _site
keepfiles:
  - "campaign-os/cockpit-operational.html"