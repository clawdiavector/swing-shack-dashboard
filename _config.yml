# t51 RETIRE / A2b (2026-09-14): GitHub Pages is a media-only mirror.
# Railway is the only product surface. Do not re-add campaign-os/** or
# cockpit HTML to this include list.
safe: true
lsi: false

include:
  - "media/**"

exclude:
  - "campaign-os/**"
  - "agents/**"
  - "data/**"
  - "docs/**"
  - "outreach/**"
  - "research/**"
  - "scripts/**"
  - "tiktok-marketing/**"
  - "*.html"
  - "*.json"
  - "*.md"
  - "*.txt"
  - "assets/**"
  - "images/**"
  - "**/_site/**"
  - "**/.*"
  - "Gemfile*"
  - "package*.json"
  - "node_modules/**"
  - "vendor/**"
