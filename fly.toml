# Fly.io config for Campaign OS
# Generated 2026-07-28
app = "campaign-os-christelle"
primary_region = "jnb"   # Johannesburg — closest to Christelle (Africa/Johannesburg UTC+2)

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data/campaign-os"
  PYTHONUNBUFFERED = "1"

[[mounts]]
  source = "campaign_os_data"
  destination = "/data/campaign-os"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
